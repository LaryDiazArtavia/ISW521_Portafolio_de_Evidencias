<!doctype html><html lang="es"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="description" content="Demostración técnica de una aplicación construida con Webpack"/><title>Comparador de productos | Webpack</title><script defer="defer" src="bundle.js"></script></head><body><header class="page-header"><h1>Comparador de productos</h1><p>Demostración técnica construida con Webpack</p></header><main class="container"><section class="card"><h2>Agregar producto</h2><form id="product-form" class="product-form"><div class="form-field"><label for="product-name">Nombre del producto</label> <input id="product-name" name="productName" placeholder="Ejemplo: Arroz" autocomplete="off"/></div><div class="form-field"><label for="product-price">Precio</label> <input id="product-price" name="productPrice" type="number" placeholder="1000" min="1" step="0.01"/></div><button class="primary-button" type="submit">Agregar</button></form><p id="message" class="message" aria-live="polite"></p></section><section class="card"><h2>Productos registrados</h2><p id="empty-message" class="empty-message">Aún no se han agregado productos.</p><div class="table-container"><table><thead><tr><th>Producto</th><th>Precio</th><th>Acción</th></tr></thead><tbody id="product-list"></tbody></table></div></section><section class="card"><h2>Resumen de compra</h2><div class="summary"><div class="summary-item"><span>Subtotal</span> <strong id="subtotal">₡0</strong></div><div class="summary-item"><span>Impuesto</span> <strong id="tax-rate">13%</strong></div><div class="summary-item"><span>Monto del impuesto</span> <strong id="tax">₡0</strong></div><div class="summary-item summary-total"><span>Total</span> <strong id="total">₡0</strong></div></div><div class="actions"><button id="clear-button" class="secondary-button" type="button">Vaciar lista</button></div></section></main></body></html>
